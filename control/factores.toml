# Factores del modelo de riesgo: qué fuerzas mueven a los activos (sustituirá a la matriz de exposición).
#
# Dos capas:
#   GENERALES (este archivo): mueven a todos los activos (bolsa, tipos, crédito, inflación, dólar, materias primas…).
#                  Todos los activos se miden frente a todos ellos.
#   ESPECÍFICOS (control/especificos.csv): explican a una o pocas posiciones concretas (el litio para un ETF de
#                  tierras raras, el bitcoin para el ether y el propio bitcoin). Solo se usan para esas posiciones y
#                  solo recogen lo que los generales no explican (se limpian de ellos antes de usarlos). Un específico
#                  se comparte entre todas las posiciones que explica: así el modelo ve que esas posiciones se mueven
#                  juntas (si no, esa parte común quedaría como riesgo propio de cada una y se perdería).
#
# Un factor es una serie DIARIA de rentabilidades (o de cambios) que se puede observar al cierre de cada sesión:
# carteras que cotizan (un ETF, la diferencia entre dos ETF) mejor que series macro, que se publican con retraso.
# Cada activo se describirá como  r_activo = α + Σ β_k · f_k + ε,  y la correlación entre activos saldrá de ahí.
#
# DECISIONES (pasos 1 y 2, ver analisis/factores.ipynb):
#   1. Qué factores se usan:  usar = true / false.
#   2. En qué ORDEN se ortogonalizan: el orden de este archivo. El primero queda tal cual; cada siguiente se limpia
#      de lo que ya explican los anteriores, así que su β mide «lo que aporta además de los anteriores».
#      Orden elegido: lo más general primero (bolsa, tipos, crédito, inflación, dólar), luego materias primas y
#      estilos. Los específicos van después de todos los generales, en el orden de especificos.csv.
#
# Tipos de factor:
#   precio       rentabilidad logarítmica diaria de `ticker`
#   diferencial  rentabilidad de `largo` menos la de `corto` (p. ej., crédito = bonos de alto riesgo − bonos del Tesoro)
#   nivel        cambio diario de una serie (`fuente` "fred" o "yahoo", `codigo`), en sus unidades (puntos)
#   cesta        cambio logarítmico ponderado de una cesta de control/variables.toml ([cestas])
#   eurusd       cambio logarítmico del euro frente al dólar, alineado con el cierre de EE. UU.
# signo = -1 invierte la serie para que «sube» signifique lo que dice el nombre (p. ej., «tipos suben»).
# alternativa = { … } (opcional): definición de repuesto que SOLO usan los análisis cuando la principal no tiene datos
#   (p. ej., sin conexión), avisando. El bot nunca la usa: un factor distinto cambiaría el significado de las β.
#   `desde` limita la alternativa a las fechas en que sus datos son buenos.

[parametros]
# Inicio de la muestra. El modelo usa las fechas en que existen TODOS los factores generales: con ACWI (bolsa mundial,
# desde marzo de 2008) y los demás de este archivo, desde julio de 2008, con la crisis financiera dentro (importa para
# estudiar las correlaciones en tensión). Un general nuevo con menos historia recorta la muestra de todos: por eso los
# que solo explican a unos pocos activos (China, sectores, cripto) van como específicos, que solo limitan las fechas
# de sus posiciones.
inicio = "2008-07-01"
# Conversión a la moneda del inversor (qué divisa usa cada activo: columna `divisa` de control/cartera.csv; vacía si el
# activo ya está en tu moneda):
#   "exacta"    cada activo se estima en su moneda y se convierte después: r_tuya = r_local − Δlog(tipo de cambio).
#               La conversión es aritmética (su β es −1 por construcción), así que no se estima. Recomendado.
#   "estimada"  se estima sobre las rentabilidades ya convertidas, con la divisa como un factor más (`usar = true` en
#               el factor Euro). Es lo que hacía la matriz; mezcla la aritmética de la conversión con la economía.
conversion = "exacta"

[factores."Renta variable"]
tipo = "precio"
ticker = "ACWI"                 # MSCI ACWI: bolsa mundial, desarrollados y emergentes
usar = true
que = "bolsa mundial"
# URTH (MSCI World) apenas se negoció en 2012-2014 (151 días sin cambio en 2012, correlación 0,29 con el S&P 500):
# solo vale desde 2015.
alternativa = { tipo = "precio", ticker = "URTH", desde = "2015-01-01" }

[factores.Tipos]
tipo = "precio"
ticker = "IEF"                  # bonos del Tesoro de EE. UU. a 7-10 años
signo = -1                      # sube = suben los tipos (el bono cae)
usar = true
que = "tipos de interés a largo plazo de EE. UU."

[factores."Crédito"]
tipo = "diferencial"
largo = "HYG"                   # bonos corporativos de alto riesgo
corto = "IEF"                   # duración distinta a HYG: lleva tipos dentro, que la ortogonalización quita
usar = true
que = "apetito por riesgo de crédito (sube = el crédito lo hace mejor que el Tesoro)"

[factores."Inflación"]
tipo = "diferencial"
largo = "TIP"                   # bonos del Tesoro ligados a la inflación
corto = "IEF"
usar = true
que = "expectativas de inflación (sube = el mercado espera más inflación)"
alternativa = { tipo = "nivel", fuente = "fred", codigo = "T10YIE" }   # inflación esperada a 10 años (FRED)

[factores."Dólar"]
tipo = "cesta"
cesta = "CESTA_DOLAR"
usar = true
que = "dólar frente a una cesta mundial (sube = dólar fuerte)"

[factores.Cobre]
tipo = "precio"
ticker = "HG=F"                 # futuro continuo: los cambios de contrato pueden meter saltos
usar = true
que = "ciclo industrial"

[factores."Petróleo"]
tipo = "precio"
ticker = "BZ=F"                 # futuro continuo (Brent)
usar = true
que = "energía"

[factores.Oro]
tipo = "precio"
ticker = "GLD"
usar = true
que = "oro"

[factores."Tecnología"]
tipo = "diferencial"
largo = "QQQ"                   # Nasdaq 100
corto = "SPY"                   # S&P 500
usar = true
que = "estilo: tecnología frente al mercado"

# --- Divisa: solo con conversion = "estimada" ------------------------------------------------------------------------

[factores.Euro]
tipo = "eurusd"
usar = false
que = "euro frente al dólar (sube = euro fuerte)"
