name: alertas

on:
  # Lo lanza cron-job.org todos los días a las 23:15 (hora de Madrid) por la API (ver README). El schedule de
  # GitHub se retrasaba horas o no se ejecutaba.
  # cron-job.org no manda inputs, así que el resumen sale solo los viernes (DIA_RESUMEN). Con el botón
  # «Run workflow», marcar «resumen» para recibirlo en el momento.
  workflow_dispatch:
    inputs:
      resumen:
        description: "Mandar el resumen aunque no sea viernes"
        type: boolean
        default: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # Versiones fijadas (requirements.lock). Para actualizarlas, ver docs/bot.md → «Dependencias».
      - run: pip install -r requirements.lock -e .
      - run: python bot/alertas.py ${{ inputs.resumen && '--resumen' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar el registro de decisiones
        if: always()
        run: |
          git config user.name "bot-finanzas"
          git config user.email "bot-finanzas@users.noreply.github.com"
          git add registro/
          git diff --cached --quiet || (git commit -m "Registro de decisiones" && git pull --rebase && git push)

permissions:
  contents: write

concurrency:
  group: registro