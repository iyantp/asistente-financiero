name: matriz

# Regenera la matriz de exposición (analisis/exposiciones.csv) cuando cambian la cartera o las variables, y comprueba
# que toda la configuración cuadra (python -m nucleo.universo). Así basta con editar control/cartera.csv, incluso
# desde github.com, sin instalar nada. Si algo no cuadra, la ejecución queda en rojo y GitHub avisa por correo.
on:
  push:
    paths:
      - control/cartera.csv
      - control/variables.toml
      - control/especificos.csv
      - control/perfil.toml
      - bot/config.py
  workflow_dispatch:

jobs:
  matriz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # para ver qué archivos cambian en el push
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock -e .
      - name: Regenerar la matriz si cambian la cartera o las variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null \
               | grep -qE '^control/(cartera\.csv|variables\.toml)$' || \
             ! python -c "from nucleo.universo import leer_matriz, coherencia; import sys; sys.exit(bool(coherencia(matriz=leer_matriz())))"; then
            python -m nucleo.exposiciones
          fi
      - name: Comprobar la configuración
        run: python -m nucleo.universo
      - name: Guardar la matriz
        run: |
          git config user.name "bot-finanzas"
          git config user.email "bot-finanzas@users.noreply.github.com"
          git add analisis/exposiciones.csv
          git diff --cached --quiet || (git commit -m "Matriz de exposición regenerada" && git pull --rebase && git push)

permissions:
  contents: write

concurrency:
  group: registro
