name: diario
on:
  # Lo lanza cron-job.org de lunes a viernes a las 06:20 (hora de Madrid) por la API (ver README). El schedule de
  # GitHub se retrasaba horas o no se ejecutaba.
  workflow_dispatch:
jobs:
  diario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # Versiones fijadas (requirements.lock). Para actualizarlas, ver docs/bot.md → «Dependencias».
      - run: pip install -r requirements.lock -e .
      - run: python bot/diario.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar el registro de decisiones
        if: always()
        run: |
          git config user.name "bot-finanzas"
          git config user.email "bot-finanzas@users.noreply.github.com"
          git add registro/
          git diff --cached --quiet || (git commit -m "Registro de decisiones" && git pull --rebase && git push)

permissions:
  contents: write

concurrency:
  group: registro